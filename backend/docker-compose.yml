# Local PostgreSQL and Redis for development: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: maikini_knigi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
