spring:
  application:
    name: maikini-knigi-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maikini_knigi}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # Creates and updates the tables from the entities. Fine for development;
    # switch to a migration tool (Flyway/Liquibase) before going to production.
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # For a password-protected Redis set SPRING_DATA_REDIS_PASSWORD

server:
  port: ${PORT:8080}

app:
  # Where the shop frontend runs; Stripe sends customers back here after paying
  frontend-url: ${FRONTEND_URL:http://localhost:5500}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}
  cart:
    # Baskets in Redis expire after this long without changes
    ttl: 2d
  anonymous-cookie:
    name: anon_id
    max-age: 7d
    # Set COOKIE_SECURE=true when served over HTTPS
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  delivery:
    fee: "3.99"
    free-from: "40.00"
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: eur
    # Only for testing against stripe-mock; leave empty to use the real Stripe API
    api-base: ${STRIPE_API_BASE:}

logging:
  level:
    bg.maikiniknigi: INFO
